[package]
name = "directional-arbitrage-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Polymarket directional arbitrage: paired arb shell + tilt toward modeled edge (limit orders only)."
license = "MIT"

[dependencies]
polymarket-client-sdk = { version = "0.4.4", default-features = false, features = ["clob", "gamma", "tracing"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
rust_decimal = { version = "1.41", features = ["serde"] }
rust_decimal_macros = "1.40"
alloy = { version = "1.6", default-features = false, features = ["signer-local", "signers"] }
